<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>
<body>
{% set user_list = ['Tom', 'Tim', 'Bob', 'Bill'] %}
<h1>В очереди:</h1>
<ul>
  {% for user in user_list %}
  <li>{{loop.index}} - {{user}}
  {% if loop.first %} - первый в очереди
  {% elif loop.last%} - последний в очереди
  {% endif %}
  {% endfor %}</li>
  Вынос переменной по индексу {{user_list[3]}}
</ul>
</body>
</html>
