{% extends "base.html" %}

{% block content %}
<h1>Новости</h1>
{% for item in news %}
<div class="row">
    <div class="col-md-6 border rounded">
        <h2>{{item.title}}</h2>
        <p>{{item.content}}</p>
        {% if item.user.name %}
        <div>Автор: {{item.user.name}}</div>
        {% else %}
        <div>Без автора</div>
        {% endif %}
    </div>
</div>
{% endfor %}

<button onclick="history.go(-1)">Назад</button>

{% endblock %}
